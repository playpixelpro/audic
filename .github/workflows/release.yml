name: Create Release

on:
  push:
    tags:
      - 'v*' # Triggers when you push a tag like v1.0.7

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Extract Release Notes
        id: extract_notes
        run: |
          # Get version from tag (e.g., v1.0.7 -> 1.0.7)
          VERSION=${GITHUB_REF_NAME#v}
          echo "Extracting notes for version $VERSION"
          
          # Extract text between the version header and the next header
          awk "/^## $VERSION/{flag=1;next}/^## /{flag=0}flag" CHANGELOG.md > release_notes.md
          
          # Fallback if no notes found
          if [ ! -s release_notes.md ]; then
            echo "No specific notes found for $VERSION in CHANGELOG.md"
            echo "New release $VERSION" > release_notes.md
          fi

      - name: Decode Keystore
        if: env.HAS_KEYSTORE == 'true'
        run: |
          mkdir -p app/keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/keystore/release.keystore
        env:
          HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APKs
        run: ./gradlew assembleRelease
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/**/*.apk
